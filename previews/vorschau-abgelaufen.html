<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Vorschau abgelaufen</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #FBF8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      color: #3A0E17; text-align: center; padding: 24px; box-sizing: border-box;
    }
    .box { max-width: 380px; }
    .icn { font-size: 38px; margin-bottom: 18px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 23px; margin: 0 0 12px; color: #3A0E17; }
    p { color: #6B4048; font-size: 15px; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icn">⏳</div>
    <h1>Diese Vorschau ist abgelaufen</h1>
    <p>Der Link war zeitlich begrenzt gültig und ist jetzt nicht mehr aufrufbar. Bei Interesse an einer aktuellen Vorschau einfach melden.</p>
  </div>
</body>
</html>
